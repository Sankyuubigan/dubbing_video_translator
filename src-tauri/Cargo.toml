[package]
name = "deedub"
version = "26.9.4"
description = "DeeDub — локальный перевод видео с субтитрами и дубляжом"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.78"

[lib]
name = "deedub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "deedub"
path = "src/main.rs"

[[bin]]
name = "test-pipeline"
path = "src/bin/test_pipeline.rs"

[[bin]]
name = "test-tts-declick"
path = "src/bin/test_tts_declick.rs"

[[bin]]
name = "test-retry-tracker"
path = "src/bin/test_retry_tracker.rs"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.0.0", features = [] }
tauri-plugin-dialog = "2.0.0-rc"
tauri-plugin-fs = "2.0.0-rc"
tauri-plugin-process = "2.0.0-rc"
tauri-plugin-speech = { path = "../../my-tauri-plugins/tauri-plugin-speech" }
tauri-plugin-logs = { path = "../../my-tauri-plugins/tauri-plugin-logs" }
# Единый движок скачивания: его использует плагин движка LLM для загрузки
# llama-server.exe и моделей (desktop §6.7 — LLM только отдельным процессом).
tauri-plugin-downloader = { path = "../../my-tauri-plugins/tauri-plugin-downloader" }
tauri-plugin-llama-engine = { path = "../../my-tauri-plugins/tauri-plugin-llama-engine", features = ["host-logs"] }

anyhow = "1.0"
thiserror = "1.0"
toml = "0.8"
dirs = "6.0"
hound = "3.5"

regex = "1.10"
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros"] }

[features]
default = []
