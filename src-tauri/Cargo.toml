[package]
name = "deedub"
version = "26.10.1"
description = "DeeDub — локальный перевод видео с субтитрами и дубляжом"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.78"

[lib]
name = "deedub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "deedub"
path = "src/main.rs"

[[bin]]
name = "test-pipeline"
path = "src/bin/test_pipeline.rs"

[[bin]]
name = "test-tts-declick"
path = "src/bin/test_tts_declick.rs"

[[bin]]
name = "test-retry-tracker"
path = "src/bin/test_retry_tracker.rs"

[[bin]]
name = "test-mt-ab"
path = "src/bin/test_mt_ab.rs"

[[bin]]
name = "test-diar-merge"
path = "src/bin/test_diar_merge.rs"

[[bin]]
name = "test-censor-filter"
path = "src/bin/test_censor_filter.rs"

[[bin]]
name = "test-srt-filter"
path = "src/bin/test_srt_filter.rs"

[[bin]]
name = "test-pitch-live"
path = "src/bin/test_pitch_live.rs"

[[bin]]
name = "test-gender-fixtures"
path = "src/bin/test_gender_fixtures.rs"

[[bin]]
name = "test-live-playlist"
path = "src/bin/test_live_playlist.rs"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.0.0", features = [] }
tauri-plugin-dialog = "2.0.0-rc"
tauri-plugin-fs = "2.0.0-rc"
tauri-plugin-process = "2.0.0-rc"
plugin-speech-gen-engine = { path = "../../cross-app-plugins/plugin-speech-gen-engine" }
plugin-log-collector = { path = "../../cross-app-plugins/plugin-log-collector" }
# Единый движок скачивания: его использует плагин движка LLM для загрузки
# llama-server.exe и моделей (desktop §6.7 — LLM только отдельным процессом).
plugin-downloader = { path = "../../cross-app-plugins/plugin-downloader" }
plugin-llama-engine = { path = "../../cross-app-plugins/plugin-llama-engine", features = ["host-logs"] }
# Потоковый ffmpeg-pipe для live-режима (шаг 2 PRP): код пайпа — в плагине,
# резолв пути к exe остаётся у хоста (crate::ffmpeg::resolve — ССОТ).
plugin-ffmpeg-wrapper = { path = "../../cross-app-plugins/plugin-ffmpeg-wrapper" }
# Резолвер HLS-ссылок для live-источников «URL» (шаг 5 PRP): yt-dlp.exe,
# его установка/обновление и прокси — ССОТ плагина (указание юзера).
# Сам плагин не регистрируется в app — хост зовёт engine::ytdlp_manager напрямую.
plugin-ytdlp-wrapper = { path = "../../cross-app-plugins/plugin-ytdlp-wrapper" }
# WS-клиент /v1/realtime движка crispasr (live, шаг 2). Версия 0.24 — как в
# cross-app-plugins (один бинарь в lockfile). Протокол: JSON-кадры, аудио —
# base64 s16le (проба 0.8.43: корневой WS плагина мёртв — 404 no matching route).
tungstenite = "0.24"
# Base64 для input_audio_buffer.append того же протокола.
base64 = "0.22"

anyhow = "1.0"
thiserror = "1.0"
toml = "0.8"
dirs = "6.0"
hound = "3.5"

regex = "1.10"
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros", "net", "sync", "fs", "io-util"] }

# Live-режим (time-shift, PRP «11.11.26 Live-режим Twitch.md» v2): HLS-загрузчик
# (reqwest+socks для опционального прокси) + loopback HTTP-сервер для hls.js
# (axum на 127.0.0.1:0 — специалист: кастомный URI-протокол в WebView2 глючит
# на медиа: Range/206, CORS) + парсинг EXT-X-PROGRAM-DATE-TIME (chrono).
reqwest = { version = "0.12", features = ["json", "socks"] }
axum = "0.8"
chrono = "0.4"

[features]
default = []
